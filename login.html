<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOGIN GREENSHOP</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <header>
      <p>
        <span>Login</span> |
        <a href="register.html">Register</a>
      </p>
      <a class="home-link" href="index.html">
        <span>&times</span>
      </a>
      <br />
      <br />
    </header>
    <main>
      <p>Enter your email and password to login.</p>
      <br />
      <form>
        <input type="email" placeholder="Enter your email address" />
        <br />
        <br />
        <input type="password" placeholder="Password" />
        <br />
        <br />
        <button class="primary-btn">Login</button>
        <br />
        <br />
      </form>
      <p>
        <img src="./images/Line7.svg" width="97px" />
        Or login with
        <img src="./images/Line8.svg" width="95px" />
      </p>
      <br />
      <button>
        <img src="./images/google1.svg" width="20px" height="20px" />
        Continue with Google
      </button>
      <br />
      <br />
      <button>
        <img src="./images/Vector.svg" width="20px" height="20px" />
        Continue with Facebook
      </button>
    </main>
    <footer class="login-footer"></footer>
  </body>
</html>
