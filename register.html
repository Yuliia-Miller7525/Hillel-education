<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REGISTER GREENSHOP</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <header>
      <p>
        <a href="login.html">Login</a> |
        <span>Register</span>
      </p>
      <a class="home-link" href="index.html">
        <span>&times</span>
      </a>
      <br />
      <br />
    </header>
    <main>
      <p>Enter your email and password to register.</p>
      <br />
      <form>
        <input type="text" placeholder="Username" />
        <br />
        <br />
        <input type="email" placeholder="Enter your email address" />
        <br />
        <br />
        <input type="password" placeholder="Password" />
        <br />
        <br />
        <input type="password" placeholder="Confirm Password" />
        <br />
        <br />
        <button class="primary-btn">Register</button>
        <br />
        <br />
      </form>
      <p>
        <img src="./images/Line7.svg" width="97px" />
        Or register with
        <img src="./images/Line8.svg" width="95px" />
      </p>
      <br />
      <button>
        <img src="./images/google1.svg" width="20px" height="20px" />
        Continue with Google
      </button>
      <br />
      <br />
      <button>
        <img src="./images/Vector.svg" width="20px" height="20px" />
        Continue with Facebook
      </button>
    </main>
    <footer class="register-footer"></footer>
  </body>
</html>
